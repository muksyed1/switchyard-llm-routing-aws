# Create User and Group Switchyard
- name: "Create Group Switchyard"
  ansible.builtin.group:
    name: "{{ group_name }}"
    state: present

- name: "Create User Switchyard"
  ansible.builtin.user:
    name: "{{ user_name }}"
    state: present
    shell: "/usr/sbin/nologin"
    group: "{{ group_name }}"
    system: true

- name: "Create directories"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "root"
    group: "root"
    mode: '0755'
  loop:
    - "{{ config_dir }}"
    - "{{ install_dir }}"
    - "{{ bin_dir }}"

- name: "Copy switchyard-server binary file"
  ansible.builtin.copy:
    src: switchyard-server
    dest: "{{ bin_dir }}"
    owner: root
    group: root
    mode: '0755'

- name: "Create SystemD Switchyard Service"
  ansible.builtin.template:
    src: "{{ user_name }}_systemd.j2"
    dest: /etc/systemd/system/{{ user_name }}.service
    owner: "root"
    group: "root"
    mode: '0644'
  notify:
      - Reload systemd daemon
      - Restart Switchyard

- name: "Copy routes.toml template to switchyard routes.toml"
  ansible.builtin.template:
    src: "routes.toml.j2"
    dest: "{{ config_dir }}/routes.toml"
    owner: "root"
    group: "{{ group_name }}"
    mode: '0640'
    validate: "{{ bin_dir }}/switchyard-server --config %s --dry-run"
  notify:
      - Restart Switchyard

# Flush Handler
- name: "Force a quick handler execution if template changed"
  ansible.builtin.meta: flush_handlers

# "Enable and Start"
- name: "Enable and Start Switchyard"
  ansible.builtin.systemd_service:
    name: "{{ user_name }}"
    state: started
    enabled: true

- name: "Wait for Switchyard port to accept connections"
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ service_port }}"
    state: started
    delay: 3        # Number of seconds to wait before first check
    timeout: 60     # Maximum seconds to wait before failing